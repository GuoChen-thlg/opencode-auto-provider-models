name: Release & Publish

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  release-and-publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com

      - name: Release and publish if version is new
        run: |
          set -uo pipefail

          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG="v${PACKAGE_VERSION}"

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "skip: ${PACKAGE_NAME}@${PACKAGE_VERSION} already published"
            exit 0
          fi

          echo "test: running test suite before publish"
          if ! npm test; then
            echo "test failed, aborting publish"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git tag "${TAG}"
            if ! git push origin "${TAG}"; then
              echo "failed to push tag ${TAG}"
              exit 1
            fi
          else
            echo "tag ${TAG} already exists"
          fi

          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            if ! gh release create "${TAG}" --title "${TAG}" --generate-notes; then
              echo "failed to create release ${TAG}"
              exit 1
            fi
          else
            echo "release ${TAG} already exists"
          fi

          if npm publish; then
            echo "published ${PACKAGE_NAME}@${PACKAGE_VERSION}"
            exit 0
          fi

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "treated as success: ${PACKAGE_NAME}@${PACKAGE_VERSION} is available (published concurrently)"
            exit 0
          fi

          echo "publish failed and version is still unavailable"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
